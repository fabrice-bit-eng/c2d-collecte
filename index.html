html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}

.between{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.num{font-variant-numeric:tabular-nums}

function iso(d){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());}
function fdate(s){if(!s)return "—";const [y,m,d]=s.slice(0,10).split("-");return d+"/"+m+"/"+y;}
function pdate(s){s=(s||"").trim();let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m){return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");}m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?s:null;}
function validIso(s){if(!s)return false;const d=new Date(s+"T00:00:00");return !isNaN(d)&&iso(d)===s;}
function fnum(n,dec=0){if(n===null||n===undefined||n==="")return "—";const v=Number(n);if(isNaN(v))return "—";return v.toLocaleString("fr-FR",{minimumFractionDigits:dec,maximumFractionDigits:dec}).replace(/ | /g," ");}
function fmd(n){return fnum(n/1e9,1);} // milliards
function pnum(s){if(typeof s==="number")return s;s=String(s||"").replace(/\s| | /g,"").replace(",",".");if(s==="")return null;const v=Number(s);return isNaN(v)?NaN:v;}
function pct(x){return x===null||isNaN(x)?"—":(x*100).toLocaleString("fr-FR",{minimumFractionDigits:1,maximumFractionDigits:1})+" %";}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function uid(){return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function nowStr(){const d=new Date();return fdate(iso(d))+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function addYears(isoS,n){const d=new Date(isoS+"T00:00:00");d.setFullYear(d.getFullYear()+n);return iso(d);}

/* ---------- calculs métier ---------- */
const recs = (type,pubOnly) => Object.values(S.recs).filter(r=>r.type===type && !r.supprime && (!pubOnly || r.statut==="Publié"));
function convEff(id){
  const c = REF.convs[id]; if(!c) return null;
  const avs = recs("av",true).filter(a=>a.d.conv===id).sort((a,b)=>(a.d.signature||"").localeCompare(b.d.signature||""));
  let dluf=c.dluf, montant=c.montant;
  avs.forEach(a=>{ if(a.d.dluf && a.d.dluf>dluf) dluf=a.d.dluf; if(a.d.montant) montant=Number(a.d.montant); });
  const decs = recs("dec",true).filter(d=>d.d.conv===id);
  const decaisse = decs.reduce((s,d)=>s+Number(d.d.montant||0),0);
  const statutEx = dluf>=TODAY_ISO ? "En cours" : "Échue";
  let delai=null; if(c.signature&&dluf){ const tot=new Date(dluf)-new Date(c.signature); const el=Math.min(new Date(TODAY_ISO),new Date(dluf))-new Date(c.signature); delai=tot>0?Math.max(0,el/tot):null; }
  return {...c, dlufEff:dluf, montantEff:montant, decaisse, reste:montant-decaisse, taux:montant?decaisse/montant:null, statutEx, delai, nbAv:avs.length, nbDec:decs.length, prog:REF.progs[c.prog]};
}
function paidOn(type,key,val,excludeUid){ return Object.values(S.recs).filter(r=>r.type===type&&!r.supprime&&r.uid!==excludeUid&&r.d[key]===val&&r.statut!=="Brouillon").reduce((s,r)=>s+montantFcfa(r),0); }
function montantFcfa(r){ const m=Number(pnum(r.d.montant)||0); return r.type==="pe"&&r.d.devise==="EUR"? Math.round(m*PARITE): m; }

/* ---------- contrôles CT-01 à CT-14 ---------- */
function check(type, d, selfUid){
  const out=[]; const T=TYPES[type]; const B=(code,msg,champ)=>out.push({code,msg,champ,niv:"B"}); const A=(code,msg,champ)=>out.push({code,msg,champ,niv:"A"});
  // CT-01 champs obligatoires
  T.fields.forEach(f=>{ if(f.showIf&&!f.showIf(d)) return; const req=f.req||(f.reqIf&&f.reqIf(d)); const val=d[f.k]; if(req&&(val===null||val===undefined||String(val).trim()==="")) B("CT-01",f.l+" : champ obligatoire",f.k); });
  // CT-02 dates
  T.fields.filter(f=>f.t==="date").forEach(f=>{ const v=d[f.k]; if(!v) return; if(!validIso(v)) B("CT-02",f.l+" : date invalide (JJ/MM/AAAA)",f.k); else if(v<"2006-01-01"||v>addYears(TODAY_ISO,1)) B("CT-02",f.l+" : hors de la période 01/01/2006 – "+fdate(addYears(TODAY_ISO,1)),f.k); });
  // CT-03 montants
  T.fields.filter(f=>f.t==="money").forEach(f=>{ const raw=d[f.k]; if(raw===null||raw===undefined||raw==="") return; const v=pnum(raw); if(isNaN(v)) return B("CT-03",f.l+" : montant non numérique",f.k); if(Math.round(v*100)!==v*100) B("CT-03",f.l+" : deux décimales au plus",f.k); if(v<=0){ if(type==="dec"&&v<0){ if(d.motif!=="reversement") B("RG-18","Montant négatif accepté uniquement avec le motif « reversement »","motif"); } else B("CT-03",f.l+" : doit être strictement positif",f.k);} });
  // CT-07 fiches rattachées existantes
  if(d.conv && !REF.convs[d.conv]) B("CT-07","Convention "+d.conv+" inexistante","conv");
  if(type==="pm" && d.marche && !REF.marches[d.marche]) B("CT-07","Marché inexistant","marche");
  if(type==="pe" && d.rubrique==="Étude" && d.etude && !REF.etudes[d.etude]) B("CT-07","Étude inexistante","etude");
  // CT-14 banque / payeur / compte
  if(type==="dec" && d.payeur && d.banque && !(REF.payeurBanques[d.payeur]||[]).includes(d.banque)) B("CT-14","Banque incompatible avec le payeur","banque");
  if(["pm","pe","si","pf"].includes(type) && d.banque && d.compte && !(REF.banqueComptes[d.banque]||[]).includes(d.compte)) B("CT-14","Compte incompatible avec la banque","compte");
  // CT-06 identifiant unique
  if(T.fields.some(f=>f.uniq) && d.ref){ const dup=Object.values(S?S.recs:{}).some(r=>r.type===type&&!r.supprime&&r.uid!==selfUid&&String(r.d.ref).trim()===String(d.ref).trim()); if(dup) B("CT-06","Référence déjà utilisée","ref"); }
  // RG-25 avenant
  if(type==="av" && !d.dluf && (d.montant===""||d.montant===null||d.montant===undefined)) B("RG-25","Indiquer une nouvelle DLUF ou un nouveau montant","dluf");
  if(type==="av" && d.dluf && d.signature && d.dluf<=d.signature) B("CT-02","La nouvelle DLUF doit être postérieure à la signature","dluf");
  if(!S) return out;
  // Alertes
  if(type==="dec" && d.conv && REF.convs[d.conv]){
    const c=convEff(d.conv); const m=pnum(d.montant)||0;
    const dbl=recs("dec").some(r=>r.uid!==selfUid&&r.d.conv===d.conv&&r.d.date===d.date&&Number(r.d.montant)===m);
    if(dbl) A("CT-08","Doublon possible : même convention, même date et même montant","montant");
    const cum=recs("dec").filter(r=>r.uid!==selfUid&&r.d.conv===d.conv&&r.statut!=="Brouillon").reduce((s,r)=>s+Number(r.d.montant||0),0)+m;
    if(cum>c.montantEff) A("CT-09","Décaissé cumulé ("+fnum(cum)+" F) supérieur au montant de la convention ("+fnum(c.montantEff)+" F)","montant");
    if(d.date && d.date>c.dlufEff) A("CT-11","Décaissement daté après la DLUF effective ("+fdate(c.dlufEff)+")","date");
    if(d.ref){ const n=recs("dec").filter(r=>r.uid!==selfUid&&r.d.ref===d.ref).length; if(n) A("RG-17","Référence Dec_id déjà présente ("+(n+1)+" fiches)","ref"); }
  }
  if(type==="pm" && REF.marches[d.marche]){ const mk=REF.marches[d.marche]; const cum=paidOn("pm","marche",d.marche,selfUid)+(pnum(d.montant)||0); if(mk.montant&&cum>mk.montant) A("CT-10","Payé cumulé ("+fnum(cum)+" F) supérieur au montant du marché ("+fnum(mk.montant)+" F)","montant"); if(mk.signature&&d.date&&d.date<mk.signature) A("CT-12","Paiement daté avant la signature du marché ("+fdate(mk.signature)+")","date"); }
  if(type==="pe" && d.rubrique==="Étude" && REF.etudes[d.etude]){ const e=REF.etudes[d.etude]; const m=(pnum(d.montant)||0)*(d.devise==="EUR"?PARITE:1); const cum=paidOn("pe","etude",d.etude,selfUid)+m; if(e.montant&&cum>e.montant) A("CT-10","Payé cumulé supérieur au montant de l'étude ("+fnum(e.montant)+" F)","montant"); if(e.signature&&d.date&&d.date<e.signature) A("CT-12","Paiement daté avant la signature de l'étude","date"); }
  return out;
}

  } else {
    const src = LST.t==="marche"?DATA.marches:DATA.etudes; const typ=LST.t==="marche"?"pm":"pe"; const key=LST.t==="marche"?"marche":"etude";
    let L=src.map(m=>({...m,paye:paidOn(typ,key,m.ref)})); if(LST.q){const q=LST.q.toLowerCase(); L=L.filter(m=>(m.ref+" "+m.intitule+" "+(m.titulaire||"")).toLowerCase().includes(q));}
    body=`<div class="small muted">${L.length} ${LST.t==="marche"?"marché(s)":"étude(s)"} · consultation · payé = paiements soumis à publiés</div><div class="card list">${L.map(m=>`<div class="item" style="cursor:default"><span class="between"><span class="t">${esc(m.intitule||m.ref)}</span><span class="chip ${m.statutM==="En cours"?"st-Soumis":"st-Brouillon"}">${esc(m.statutM||"—")}</span></span><span class="small muted">${esc(m.ref)} · ${esc(m.titulaire||"")}</span><span class="between small"><span class="muted">Montant ${fnum(m.montant)} F</span><b class="num">Payé ${fnum(m.paye)} F · ${m.montant?pct(m.paye/m.montant):"—"}</b></span></div>`).join("")}</div>`;
  }
  shell("Fiches", `<div class="chips" role="group" aria-label="Type de fiche">${tabs.map(([k,l])=>`<button class="f" data-act="tab" data-t="${k}" aria-pressed="${LST.t===k}">${l}</button>`).join("")}</div>

   ${body}`, {navFiches:true});

   <section class="card pad"><h2 style="margin-bottom:10px">Historique</h2><div class="tl">${r.hist.slice().reverse().map(h=>`<div class="ev"><i></i><div><b>${esc(h.txt)}</b><div class="tiny muted">${esc(h.user)} · ${esc(h.date)}</div></div></div>`).join("")}</div></section>
  `, {back:true, navFiches:true});

function addPiece(r,file,typePiece){
  if(!file) return; if(r.pieces.length>=20) return toast("20 pièces au maximum par fiche.");
  const ok=/^(image\/(jpeg|png|webp|heic)|application\/pdf|application\/vnd\.openxmlformats)/.test(file.type)||/\.(pdf|docx|xlsx|jpe?g|png)$/i.test(file.name);
  if(!ok) return toast("Format refusé : PDF, JPEG, PNG, DOCX ou XLSX uniquement.");
  const done=(img,taille)=>{ r.pieces.push({nom:file.name,typePiece,taille,img,synced:false,date:nowStr()}); r.hist.push({date:nowStr(),user:me().nom,txt:"Pièce ajoutée : "+file.name}); r.synced=false; queueOp(r,"Pièce jointe"); save(); toast("Pièce ajoutée."); render(); };
  if(file.type.startsWith("image/")){
    const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,2000/Math.max(im.width,im.height)); const c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height); const full=c.toDataURL("image/jpeg",.7); const t=document.createElement("canvas"); const kt=160/Math.max(c.width,c.height); t.width=Math.round(c.width*kt); t.height=Math.round(c.height*kt); t.getContext("2d").drawImage(c,0,0,t.width,t.height); done(t.toDataURL("image/jpeg",.7), Math.round(full.length*0.75)); }; im.onerror=()=>toast("Image illisible."); im.src=fr.result; }; fr.readAsDataURL(file);
  } else { if(file.size>5e6) return toast("Fichier trop volumineux : 5 Mo au maximum sur mobile."); done(null,file.size); }
}

function submitForm(to){

  const u=me(); let r;
  const d={...F.d}; T.fields.forEach(f=>{ if(f.t==="money"&&d[f.k]!==""&&d[f.k]!==null) d[f.k]=pnum(d[f.k]); });
  if(F.uid){ r=S.recs[F.uid]; const ch=T.fields.filter(f=>String(r.d[f.k]??"")!==String(d[f.k]??"")).map(f=>f.l+" : "+(r.d[f.k]===""||r.d[f.k]==null?"(vide)":r.d[f.k])+" → "+(d[f.k]===""||d[f.k]==null?"(vide)":d[f.k])); r.d={...r.d,...d}; if(ch.length) r.hist.push({date:nowStr(),user:u.nom,txt:"Modification : "+ch.join(" ; ")}); r.version++; }
  else { r={uid:uid(),type:F.t,d,statut:"Brouillon",auteur:u.nom,origine:"mobile",cree:nowStr(),version:1,synced:false,hist:[{date:nowStr(),user:u.nom,txt:"Création sur le terminal "+S.terminal}],pieces:[],anomalies:[]}; S.recs[r.uid]=r; }
  r.modifPar=u.nom; r.synced=false; r.anomalies=res.map(x=>x.code+" · "+x.msg);
  if(to==="Soumis"){ const from=r.statut; r.statut="Soumis"; r.hist.push({date:nowStr(),user:u.nom,txt:from+" → Soumis"}); }
  else if(r.statut!=="À corriger") r.statut="Brouillon";

  V.stack=V.stack.filter(s=>s.view!=="form"); go("detail",{u:r.uid},false);
}
function queueOp(r,action){ S.queue.push({uid:r.uid,action,date:nowStr(),version:r.version}); }

/* ===== Workflow ===== */
function wf(r,to,motif){
  const u=me(); const from=r.statut;
  if(to==="Validé"&&r.modifPar===u.nom) return toast("Séparation des tâches : vous ne pouvez pas valider une fiche que vous avez modifiée en dernier (RG-02).");
  if(to==="Publié"){ const p=parentOk(r); if(p) return toast(p); }
  r.statut=to; if(to==="À corriger") r.motifRenvoi=motif; r.hist.push({date:nowStr(),user:u.nom,txt:from+" → "+to+(motif?" · motif : "+motif:"")}); r.synced=false; queueOp(r,from+" → "+to);
  if(to==="Publié"&&r.type==="dec"&&!r.d.n) r.d.n=nextNum("dec");
  save(); toast("Statut de la fiche : "+to+"."); render();
}
function parentOk(r){ // RG-38
  if(r.type==="av"||r.type==="dec"||r.type==="si"||r.type==="pf"){ if(!REF.convs[r.d.conv]) return "Publication impossible : la convention parente n'existe pas (RG-38)."; }
  return null;
}
function nextNum(t){ return Math.max(0,...recs(t).map(r=>Number(r.d.n)||0))+1; }
function sheet(html,onReady){ const s=document.createElement("div"); s.className="sheet"; s.innerHTML=`<div role="dialog" aria-modal="true">${html}</div>`; s.onclick=e=>{ if(e.target===s) s.remove(); }; document.body.appendChild(s); onReady&&onReady(s); return s; }

function doSync(){
  const ops=S.queue.slice(); let acc=0,al=0,rej=0; const h=nowStr(); const seen=new Set();
  ops.forEach(o=>{ const r=S.recs[o.uid]; if(!r||seen.has(o.uid)) return; seen.add(o.uid);
    const res=check(r.type,r.d,r.uid); const b=res.filter(x=>x.niv==="B"); const a=res.filter(x=>x.niv==="A");
    const titre=TYPES[r.type].title(r.d);
    if(b.length&&r.statut!=="Brouillon"&&r.statut!=="À corriger"){ rej++; r.statut="À corriger"; r.motifRenvoi="Rejet serveur : "+b.map(x=>x.code).join(", "); r.hist.push({date:h,user:"Serveur",txt:"Rejet à la synchronisation : "+b.map(x=>x.code+" "+x.msg).join(" ; ")}); S.journal.push({date:h,titre,action:o.action,res:"Rejetée",motif:b.map(x=>x.code).join(", ")}); }
    else { if(r.type==="dec"&&!r.d.n&&r.statut!=="Brouillon"){ r.d.n=nextNum("dec"); r.hist.push({date:h,user:"Serveur",txt:"N° d'ordre attribué : "+r.d.n}); }
      if(a.length){ al++; S.journal.push({date:h,titre,action:o.action,res:"Acceptée avec alerte",motif:a.map(x=>x.code).join(", ")}); } else { acc++; S.journal.push({date:h,titre,action:o.action,res:"Acceptée"}); } }
    r.synced=true; r.pieces.forEach(p=>p.synced=true); r.anomalies=res.map(x=>x.code+" · "+x.msg);
  });
  S.queue=[]; S.lastSync=h; save(); SYNC_LAST={h,acc,al,rej}; toast("Synchronisation terminée."); render();
}

  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const csv="﻿"+[head.map(q).join(";"),...L.map(r=>cols.map(c=>q(c==="statut"?r.statut:c==="auteur"?r.auteur:r.d[c])).join(";"))].join("\r\n");
  const meta=`# Export ${T.plural} · ${L.length} lignes · filtre statut : ${LST.st} · ${nowStr()} · ${me().nom}`;
  sheet(`<h2>Exporter ${esc(T.plural)}</h2><p class="small muted" style="margin:0">${L.length} ligne(s), séparateur « ; », encodage UTF-8. ${esc(meta)}</p>
   <div class="btns"><button class="btn" id="dl">Télécharger le fichier CSV</button><button class="btn alt" id="cp">Copier le contenu</button></div>
   <p class="hint" style="margin:0">Le téléchargement fonctionne dans l'application installée. Dans un aperçu en ligne, utilisez « Copier » puis collez dans Excel.</p>
   <button class="btn alt" id="cl">Fermer</button>`, s=>{
    $("#cl",s).onclick=()=>s.remove();
    $("#dl",s).onclick=()=>{ try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})); a.download="C2D_"+LST.t+"_"+TODAY_ISO+".csv"; document.body.appendChild(a); a.click(); a.remove(); toast("Téléchargement lancé."); }catch(e){ toast("Téléchargement impossible ici : utilisez Copier."); } };
    $("#cp",s).onclick=()=>{ (navigator.clipboard?navigator.clipboard.writeText(csv):Promise.reject()).then(()=>toast("Contenu copié : collez-le dans Excel.")).catch(()=>{ const ta=document.createElement("textarea"); ta.className="inp"; ta.value=csv; ta.style.height="140px"; s.firstChild.appendChild(ta); ta.select(); toast("Sélectionnez puis copiez le texte affiché."); }); };
  });
}

/* ---------- routeur et événements ---------- */
function render(){
  if(!S.user) return vLogin();
  ({home:vHome,fiches:vFiches,detail:vDetail,conv:vConv,saisie:vSaisie,form:vForm,sync:vSync,tb:vTB,profil:vProfil}[V.view]||vHome)();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b||!app.contains(b)&&!b.closest(".sheet")) return;
  const a=b.dataset.act;
  if(a==="go"){ const p=b.dataset.p?JSON.parse(b.dataset.p):{}; if(b.dataset.root) V.stack=[]; go(b.dataset.v,p,!b.dataset.root); }
  else if(a==="back") back();
  else if(a==="detail") go("detail",{u:b.dataset.u});
  else if(a==="conv") go("conv",{id:b.dataset.id});
  else if(a==="new"){ const pre=b.dataset.conv?{conv:b.dataset.conv}:{}; newForm(b.dataset.t,pre); }
  else if(a==="edit") editForm(S.recs[b.dataset.u]);
  else if(a==="tab"){ LST.t=b.dataset.t; LST.st="Tous"; LST.n=50; vFiches(); }
  else if(a==="st"){ LST.st=b.dataset.s; LST.n=50; vFiches(); }
  else if(a==="more"){ LST.n+=50; vFiches(); }
  else if(a==="export") exportCsv();
  else if(a==="saveform") submitForm("Brouillon");
  else if(a==="wf") wf(S.recs[b.dataset.u], b.dataset.to);
  else if(a==="renvoi"){ const r=S.recs[b.dataset.u]; const reopen=!!b.dataset.reopen;
    sheet(`<h2>${reopen?"Rouvrir la fiche":"Renvoyer en correction"}</h2><label class="fld"><span>Motif <span class="req">*</span> <span class="hint">500 caractères au plus (RG-34)</span></span><textarea class="inp" id="motif" maxlength="500"></textarea></label><span class="errtxt" id="merr"></span><div class="btns"><button class="btn alt" id="mx">Annuler</button><button class="btn warn" id="mo">${reopen?"Rouvrir":"Renvoyer"}</button></div>`, s=>{ $("#motif",s).focus(); $("#mx",s).onclick=()=>s.remove(); $("#mo",s).onclick=()=>{ const m=$("#motif",s).value.trim(); if(!m) return $("#merr",s).textContent="Le motif est obligatoire."; s.remove(); wf(r,"À corriger",m); }; }); }
  else if(a==="abandon"){ const r=S.recs[b.dataset.u]; r.supprime=true; r.hist.push({date:nowStr(),user:me().nom,txt:"Brouillon abandonné"}); S.queue=S.queue.filter(o=>o.uid!==r.uid); save(); toast("Brouillon abandonné."); back(); }
  else if(a==="dosync") doSync();
  else if(a==="tbc"){ TBC=b.dataset.c; vTB(); }
  else if(a==="logout"){ S.user=null; save(); V.stack=[]; F=null; render(); }
  else if(a==="reset"){ if(!RESET_ASK){ RESET_ASK=true; vProfil(); } else { RESET_ASK=false; const u=S.user; seed(); S.user=u; save(); SYNC_LAST=null; toast("Base réinitialisée à l'état de la reprise."); go("home",{},false); } }
});
window.addEventListener("online",()=>render()); window.addEventListener("offline",()=>render());

/* ---------- démarrage ---------- */
S = load(); if(!S) seed();
if(S.user && !USERS[S.user]) S.user=null;
V.view = S.user ? "home" : "login";
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
